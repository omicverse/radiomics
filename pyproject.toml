[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ov-radiomics"
version = "0.1.0"
description = "Reproducible radiomics, clinical modeling, and probability fusion for OmicVerse"
license = {file = "LICENSE"}
requires-python = ">=3.9"
dependencies = ["numpy>=1.23", "pandas>=1.3", "scipy>=1.9", "scikit-learn>=1.0", "statsmodels>=0.13", "matplotlib>=3.5", "seaborn>=0.11", "joblib>=1.1"]

[project.urls]
Repository = "https://github.com/omicverse/radiomics"
Issues = "https://github.com/omicverse/radiomics/issues"

[project.optional-dependencies]
image = ["SimpleITK>=2.2", "pyradiomics>=3.0", "PyYAML>=6"]
boost = ["xgboost>=1.6", "lightgbm>=3.3"]
smote = ["imbalanced-learn>=0.9"]
test = ["pytest>=7", "nbformat>=5", "nbclient>=0.7", "ipykernel>=6"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
